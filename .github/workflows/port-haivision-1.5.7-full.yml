name: Port full OpenIRL SRTLA stack to Haivision 1.5.7

on:
  push:
    paths:
      - .github/workflows/port-haivision-1.5.7-full.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge full OpenIRL .3 patch set onto Haivision 1.5.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add haivision https://github.com/Haivision/srt.git 2>/dev/null || true
          git fetch --force haivision refs/tags/v1.5.7:refs/tags/v1.5.7
          git fetch --force origin 'refs/tags/v1.5.4+openirl.3:refs/tags/v1.5.4+openirl.3'
          git checkout -B port/openirl-1.5.7-full refs/tags/v1.5.7

          set +e
          git merge --no-ff --no-commit refs/tags/v1.5.4+openirl.3
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'srtcore/core.cpp\nsrtcore/core.h\nsrtcore/queue.cpp\ntest/test_common.cpp'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              git diff --cc || true
              exit 1
            fi

            git checkout --conflict=diff3 -- srtcore/core.cpp srtcore/core.h srtcore/queue.cpp test/test_common.cpp

            python3 - <<'PY'
          from pathlib import Path
          import re

          def split_conflict(path):
              p = Path(path)
              text = p.read_text()
              if text.count("<<<<<<< ours") != 1 or text.count(">>>>>>> theirs") != 1:
                  raise SystemExit(f"Unexpected conflict count in {path}")
              before, rest = text.split("<<<<<<< ours\n", 1)
              ours, rest = rest.split("||||||| base\n", 1)
              _base, rest = rest.split("=======\n", 1)
              theirs, after = rest.split(">>>>>>> theirs\n", 1)
              return p, before, ours, theirs, after

          # core.cpp: preserve both Haivision's rate measurement and OpenIRL's
          # SRTLA loss-report timing additions.
          p, before, ours, theirs, after = split_conflict("srtcore/core.cpp")
          p.write_text(before + ours.rstrip() + "\n\n" + theirs.lstrip() + after)

          # OpenIRL .3's new NAK planner was written against 1.5.4's payload member.
          # 1.5.7 split this into data/control payload sizes; loss reports carry data
          # sequence numbers, matching upstream's use of m_iMaxDataPayloadSize here.
          core = Path("srtcore/core.cpp")
          text = core.read_text()
          old = "np.cap        = (size_t)m_iMaxSRTPayloadSize / 4;"
          new = "np.cap        = (size_t)m_iMaxDataPayloadSize / sizeof(int32_t);"
          if old not in text:
              raise SystemExit("SRTLA NAK planner payload expression changed unexpectedly")
          core.write_text(text.replace(old, new, 1))

          # core.h: preserve the 1.5.7 bool processCtrl signature and OpenIRL's
          # confirmed-loss quality accounting declaration.
          p, before, ours, theirs, after = split_conflict("srtcore/core.h")
          replacement = """    /// Record packets that are being requested back for the first time, that is,
              /// that were still missing once the reorder grace period was over. Feeds
              /// pctRcvQuality. NAK repeats must not be passed here.
              /// Takes m_StatsLock, so the caller must not hold it.
              /// @param pkts  number of sequence numbers confirmed as lost
              void countConfirmedLoss(int pkts);

              bool processCtrl(const CPacket& ctrlpkt);

          """
          p.write_text(before + replacement + after)

          # queue.cpp: keep the 1.5.7 removeFromLists/resetAtFork side of the
          # conflict. The SRTLA ownership addition belongs in the 1.5.7 mux dtor.
          p, before, ours, theirs, after = split_conflict("srtcore/queue.cpp")
          p.write_text(before + ours + after)

          # 1.5.7 defines CMultiplexer::~CMultiplexer inline in queue.h, where
          # SrtlaRec is only forward-declared. Move it to queue.cpp so deleting
          # m_pSrtlaRec invokes the real destructor rather than deleting an
          # incomplete type.
          qh = Path("srtcore/queue.h")
          text = qh.read_text()
          pattern = re.compile(
              r"    ~CMultiplexer\(\)\n"
              r"    \{\n"
              r"        if \(m_pRcvQueue != NULL\)\n"
              r"            delete m_pRcvQueue;\n"
              r"        if \(m_pSndQueue != NULL\)\n"
              r"            delete m_pSndQueue;\n"
              r"        if \(m_pTimer != NULL\)\n"
              r"            delete m_pTimer;\n"
              r"        close\(\);\n"
              r"    \}\n"
          )
          text, n = pattern.subn("    ~CMultiplexer();\n", text, count=1)
          if n != 1:
              raise SystemExit("CMultiplexer inline destructor changed unexpectedly")
          qh.write_text(text)

          qc = Path("srtcore/queue.cpp")
          text = qc.read_text()
          anchor = "void srt::CMultiplexer::resetAtFork()\n"
          if anchor not in text:
              raise SystemExit("CMultiplexer resetAtFork anchor missing")
          destructor = """srt::CMultiplexer::~CMultiplexer()
          {
              if (m_pRcvQueue != NULL)
                  delete m_pRcvQueue;
              if (m_pSndQueue != NULL)
                  delete m_pSndQueue;
              // The SRTLA demux is borrowed by both queues; destroy it after
              // their workers are gone and before the shared timer/channel.
              if (m_pSrtlaRec != NULL)
                  delete m_pSrtlaRec;
              if (m_pTimer != NULL)
                  delete m_pTimer;
              close();
          }

          """
          qc.write_text(text.replace(anchor, destructor + anchor, 1))

          # test_common.cpp: retain both upstream cookie tests and OpenIRL quality tests.
          p, before, ours, theirs, after = split_conflict("test/test_common.cpp")
          p.write_text(before + ours.rstrip() + "\n" + theirs.lstrip() + after)

          for path in [
              "srtcore/core.cpp", "srtcore/core.h", "srtcore/queue.cpp",
              "srtcore/queue.h", "test/test_common.cpp"
          ]:
              data = Path(path).read_text()
              if any(marker in data for marker in ("<<<<<<<", "|||||||", "=======", ">>>>>>>")):
                  raise SystemExit(f"Unresolved conflict marker remains in {path}")
          PY

            git add srtcore/core.cpp srtcore/core.h srtcore/queue.cpp srtcore/queue.h test/test_common.cpp
          fi

          git diff --check
          git commit -m "Merge full OpenIRL SRTLA stack onto Haivision SRT 1.5.7"

      - name: Preserve legacy SRTLA stats API for SLS 1.5.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # OpenIRL .3 modernized the SRTLA stats layout. Keep those fields unchanged,
          # but append the .1-era field names used by OpenIRL srt-live-server 1.5.2.
          sh = Path("srtcore/srt.h")
          text = sh.read_text()
          old = """    uint64_t establishedMs;     // link start, demux monotonic milliseconds
          } SRT_SRTLA_PEER_STATS;
          """
          new = """    uint64_t establishedMs;     // link start, demux monotonic milliseconds

              // Legacy OpenIRL stats fields retained for source compatibility with
              // srt-live-server 1.5.2. New consumers should use the fields above.
              uint32_t bitrate;            // alias of kbpsRecvUnique
              uint32_t jitter;             // alias of usJitter
              uint64_t bytesReceived;      // cumulative received wire bytes
              uint32_t uptime;             // seconds since this link was established
              uint32_t throughput;         // alias of kbpsRecvRate
          } SRT_SRTLA_PEER_STATS;
          """
          if old not in text:
              raise SystemExit("SRT_SRTLA_PEER_STATS layout changed unexpectedly")
          text = text.replace(old, new, 1)

          old = """    SRT_SRTLA_PEER_STATS peers[SRT_SRTLA_MAX_PEERS];
          } SRT_SRTLA_STATS;
          """
          new = """    SRT_SRTLA_PEER_STATS peers[SRT_SRTLA_MAX_PEERS];

              // Legacy OpenIRL aggregate fields retained for SLS 1.5.2.
              uint32_t totalBitrate;        // sum of per-link unique receive rates
              uint64_t timestamp;           // alias of nowMs
          } SRT_SRTLA_STATS;
          """
          if old not in text:
              raise SystemExit("SRT_SRTLA_STATS layout changed unexpectedly")
          sh.write_text(text.replace(old, new, 1))

          # Track the legacy cumulative bytesReceived value without changing the .3
          # rate estimators or their semantics.
          rh = Path("srtcore/srtla_rec.h")
          text = rh.read_text()
          old = """        double     unique_acc;         // first-seen (non-duplicate) wire bytes
              time_point rate_last;
          """
          new = """        double     unique_acc;         // first-seen (non-duplicate) wire bytes
              uint64_t   bytes_received_total; // cumulative wire bytes for legacy stats
              time_point rate_last;
          """
          if old not in text:
              raise SystemExit("SrtlaRec Link rate fields changed unexpectedly")
          text = text.replace(old, new, 1)
          old = """            , unique_acc(0.0)
                  , rate_init(false)
          """
          new = """            , unique_acc(0.0)
                  , bytes_received_total(0)
                  , rate_init(false)
          """
          if old not in text:
              raise SystemExit("SrtlaRec Link constructor changed unexpectedly")
          rh.write_text(text.replace(old, new, 1))

          rc = Path("srtcore/srtla_rec.cpp")
          text = rc.read_text()
          old = """    Group* g = ref.g;
              Link*  l = ref.l;
          """
          new = """    Group* g = ref.g;
              Link*  l = ref.l;
              l->bytes_received_total += uint64_t(total);
          """
          if old not in text:
              raise SystemExit("SrtlaRec ingress membership block changed unexpectedly")
          text = text.replace(old, new, 1)

          old = """    out->valid = 1;
              out->nowMs = uint64_t(count_milliseconds(now.time_since_epoch()));
          """
          new = """    out->valid = 1;
              out->nowMs = uint64_t(count_milliseconds(now.time_since_epoch()));
              out->timestamp = out->nowMs;
              out->totalBitrate = 0;
          """
          if old not in text:
              raise SystemExit("SrtlaRec fillStats header changed unexpectedly")
          text = text.replace(old, new, 1)

          old = """        out->peers[i].connectionId   = it->connectionId;
                  out->peers[i].kbpsRecvRate   = uint32_t(it->recv_acc   * decay * 8.0 / 1000.0);
                  out->peers[i].kbpsRecvUnique = uint32_t(it->unique_acc * decay * 8.0 / 1000.0);
                  out->peers[i].transitUs      = int32_t(it->transit_ewma);
                  out->peers[i].usJitter       = uint32_t(it->jitter_ewma);
                  out->peers[i].establishedMs  = uint64_t(count_milliseconds(it->established.time_since_epoch()));
          """
          new = """        out->peers[i].connectionId   = it->connectionId;
                  out->peers[i].kbpsRecvRate   = uint32_t(it->recv_acc   * decay * 8.0 / 1000.0);
                  out->peers[i].kbpsRecvUnique = uint32_t(it->unique_acc * decay * 8.0 / 1000.0);
                  out->peers[i].transitUs      = int32_t(it->transit_ewma);
                  out->peers[i].usJitter       = uint32_t(it->jitter_ewma);
                  out->peers[i].establishedMs  = uint64_t(count_milliseconds(it->established.time_since_epoch()));

                  // Populate the legacy view from the modern .3 measurements.
                  out->peers[i].bitrate       = out->peers[i].kbpsRecvUnique;
                  out->peers[i].throughput    = out->peers[i].kbpsRecvRate;
                  out->peers[i].jitter        = out->peers[i].usJitter;
                  out->peers[i].bytesReceived = it->bytes_received_total;
                  const uint64_t uptime_ms = out->nowMs > out->peers[i].establishedMs
                      ? out->nowMs - out->peers[i].establishedMs : 0;
                  const uint64_t uptime_s = uptime_ms / 1000;
                  out->peers[i].uptime = uptime_s > uint64_t(0xffffffffu)
                      ? 0xffffffffu : uint32_t(uptime_s);
                  out->totalBitrate += out->peers[i].bitrate;
          """
          if old not in text:
              raise SystemExit("SrtlaRec fillStats peer block changed unexpectedly")
          rc.write_text(text.replace(old, new, 1))
          PY

          git add srtcore/srt.h srtcore/srtla_rec.h srtcore/srtla_rec.cpp
          git diff --cached --check
          git commit -m "compat: retain legacy SRTLA stats fields for SLS 1.5.2"

      - name: Verify full OpenIRL .3 API/features are present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SRTO_SRTLA = 120' srtcore/srt.h
          grep -q 'SRT_SRTLA_STATS' srtcore/srt.h
          grep -q 'srt_srtla_stats' srtcore/srt.h
          grep -q 'SRTLA_MIN_RCVLATENCY_MS' srtcore/core.cpp
          grep -q 'SRTLA_NAK_PERIOD_US' srtcore/core.cpp
          grep -q 'countConfirmedLoss' srtcore/core.cpp
          grep -q 'm_iMaxDataPayloadSize / sizeof(int32_t)' srtcore/core.cpp
          grep -q 'uint32_t totalBitrate' srtcore/srt.h
          grep -q 'uint32_t bitrate' srtcore/srt.h
          grep -q 'uint32_t throughput' srtcore/srt.h
          grep -q 'bytes_received_total' srtcore/srtla_rec.h
          test -f srtcore/srtla_rec.cpp
          test -f srtcore/srtla_rec.h

      - name: Build patched libsrt
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config tclsh libssl-dev zlib1g-dev libsqlite3-dev
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON \
            -DENABLE_UNITTESTS=ON
          cmake --build build --parallel 2
          sudo cmake --install build
          sudo ldconfig

      - name: Run libsrt unit tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure

      - name: Build OpenIRL srt-live-server 1.5.2 against patched libsrt
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.5.2 https://github.com/OpenIRL/srt-live-server.git /tmp/srt-live-server
          make -C /tmp/srt-live-server -j2

      - name: Publish tested PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/port/openirl-1.5.7-full
