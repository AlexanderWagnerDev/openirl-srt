name: Port OpenIRL SRTLA patches to Haivision 1.5.7

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/port-haivision-1.5.7.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port OpenIRL compatibility patch set onto Haivision 1.5.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add haivision https://github.com/Haivision/srt.git 2>/dev/null || true
          git fetch --force haivision refs/tags/v1.5.7:refs/tags/v1.5.7
          git fetch --force origin 'refs/tags/v1.5.4+openirl.1:refs/tags/v1.5.4+openirl.1'

          git checkout -B port/openirl-1.5.7 refs/tags/v1.5.7

          set +e
          git merge --no-ff --no-commit refs/tags/v1.5.4+openirl.1
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'srtcore/core.cpp\nsrtcore/core.h'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              git diff --cc || true
              exit 1
            fi

            python3 - <<'PY'
          from pathlib import Path

          core = Path("srtcore/core.cpp")
          text = core.read_text()
          old = """<<<<<<< HEAD
              // Will be updated on first send
          #ifdef ENABLE_MAXREXMITBW
              m_zSndAveragePacketSize = 0;
              m_zSndMaxPacketSize = 0;
          #endif

              // Initialize mutex and condition variables.
          =======
              memset(&m_SrtlaStats, 0, sizeof(m_SrtlaStats));

              // Initilize mutex and condition variables.
          >>>>>>> refs/tags/v1.5.4+openirl.1"""
          new = """    // Will be updated on first send
          #ifdef ENABLE_MAXREXMITBW
              m_zSndAveragePacketSize = 0;
              m_zSndMaxPacketSize = 0;
          #endif

              memset(&m_SrtlaStats, 0, sizeof(m_SrtlaStats));

              // Initialize mutex and condition variables."""
          if old not in text:
              raise SystemExit("core.cpp conflict block changed unexpectedly")
          text = text.replace(old, new, 1)

          # Haivision 1.5.7 replaced the raw receiver-loss array API with
          # FixedArray and renamed the payload-size member. Keep OpenIRL's
          # SRTLA fresh-loss filtering logic, but use the current upstream API.
          old_api = """                const int cap = m_iMaxSRTPayloadSize / 4;
                          int32_t* arr = new int32_t[cap];
                          int arrlen = 0;
                          m_pRcvLossList->getLossArray(arr, arrlen, cap);"""
          new_api = """                FixedArray<int32_t> arr(m_iMaxDataPayloadSize / sizeof(int32_t));
                          const int arrlen = m_pRcvLossList->getLossArray(arr);"""
          if old_api not in text:
              raise SystemExit("legacy getLossArray block changed unexpectedly")
          text = text.replace(old_api, new_api, 1)

          old_delete = "                delete[] arr;\n"
          if text.count(old_delete) != 1:
              raise SystemExit("legacy loss-array delete block changed unexpectedly")
          text = text.replace(old_delete, "", 1)
          core.write_text(text)

          hdr = Path("srtcore/core.h")
          text = hdr.read_text()
          old = """<<<<<<< HEAD
              bool processCtrl(const CPacket& ctrlpkt);
          =======
              void processCtrl(const CPacket& ctrlpkt);
              void processSrtlaStats(const CPacket& ctrlpkt);
          >>>>>>> refs/tags/v1.5.4+openirl.1"""
          new = """    bool processCtrl(const CPacket& ctrlpkt);
              void processSrtlaStats(const CPacket& ctrlpkt);"""
          if old not in text:
              raise SystemExit("core.h conflict block changed unexpectedly")
          hdr.write_text(text.replace(old, new, 1))

          for path in (core, hdr):
              data = path.read_text()
              if "<<<<<<<" in data or ">>>>>>>" in data or "=======" in data:
                  raise SystemExit(f"unresolved conflict marker remains in {path}")
          PY

            git add srtcore/core.cpp srtcore/core.h
          fi

          git diff --check
          git commit -m "Merge OpenIRL SRTLA compatibility patches onto Haivision SRT 1.5.7"

      - name: Verify legacy OpenIRL SRTLA API is preserved
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SRTO_SRTLAPATCHES' srtcore/srt.h
          grep -q 'SRT_SRTLA_STATS' srtcore/srt.h
          grep -q 'srt_srtla_stats' srtcore/srt.h
          grep -q 'UMSG_SRTLA_STATS' srtcore/common.h
          grep -q 'processSrtlaStats' srtcore/core.cpp
          grep -q 'FixedArray<int32_t> arr(m_iMaxDataPayloadSize / sizeof(int32_t))' srtcore/core.cpp

      - name: Build patched libsrt
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config tclsh libssl-dev zlib1g-dev libsqlite3-dev
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON
          cmake --build build --parallel 2
          sudo cmake --install build
          sudo ldconfig

      - name: Build OpenIRL srt-live-server 1.5.2 against patched libsrt
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.5.2 https://github.com/OpenIRL/srt-live-server.git /tmp/srt-live-server
          make -C /tmp/srt-live-server -j2

      - name: Publish tested branch and compatibility tag
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/port/openirl-1.5.7
          git tag -f -a v1.5.7+openirl.1 -m "OpenIRL SRTLA compatibility patches on Haivision SRT 1.5.7"
          git push --force origin refs/tags/v1.5.7+openirl.1
